<title>GitHub 破千周榜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">1K</span>
      <div>
        <h1>GitHub 破千周榜</h1>
        <p class="tagline">每周精选刚突破 1000 Star 的新项目</p>
      </div>
    </div>
    <div class="header-right">
      <a class="gh-star" href="https://github.com/fhan235/github1K" target="_blank" rel="noopener noreferrer" title="在 GitHub 上 Star 这个项目">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>Star</span>
      </a>
      <label class="week-picker" id="week-picker-box">
        <span>期数</span>
        <select id="week-select" aria-label="选择周榜期数"></select>
      </label>
      <label class="week-picker" id="day-picker-box" hidden>
        <span>日期</span>
        <select id="day-select" aria-label="选择日报日期"></select>
      </label>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" role="tablist" aria-label="切换榜单">
    <button class="tab active" id="tab-week" role="tab" aria-selected="true">📅 周榜</button>
    <button class="tab" id="tab-daily" role="tab" aria-selected="false">🚀 日报</button>
  </nav>

  <div id="view-week">
    <section id="hero" class="hero" aria-live="polite"></section>

    <section id="podium" class="podium" hidden></section>

    <section class="list-section">
      <div class="list-head">
        <h2 id="list-title">全部精选</h2>
        <div class="toolbar">
          <input id="search" type="search" placeholder="搜索项目名、描述、话题…" autocomplete="off" maxlength="100">
          <select id="lang-select" aria-label="按语言筛选"></select>
          <select id="sort-select" aria-label="排序方式">
            <option value="rank">按榜单排名</option>
            <option value="score">按评分</option>
            <option value="gain">按一周涨幅</option>
            <option value="stars">按 Star 数</option>
            <option value="created">按创建时间（新→旧）</option>
          </select>
        </div>
      </div>
      <nav id="category-chips" class="chips" aria-label="按类别筛选"></nav>
      <p id="result-count" class="result-count"></p>
      <div id="list" class="list"></div>
    </section>

    <section id="continuing" class="continuing" hidden>
      <h2>持续走强 <small>往期上榜，本周仍在涨</small></h2>
      <div class="table-wrap"><table>
        <thead><tr><th>项目</th><th class="num">上榜时 Star</th><th class="num">当前 Star</th><th class="num">一周增量</th></tr></thead>
        <tbody id="continuing-body"></tbody>
      </table></div>
    </section>
  </div>

  <div id="view-daily" hidden>
    <section id="daily-hero" class="hero" aria-live="polite"></section>

    <section class="list-section">
      <div class="list-head">
        <h2>当日破千项目</h2>
        <div class="toolbar">
          <input id="d-search" type="search" placeholder="搜索项目名、描述、话题…" autocomplete="off" maxlength="100">
          <select id="d-lang-select" aria-label="按语言筛选"></select>
          <select id="d-sort-select" aria-label="排序方式">
            <option value="gain">按当日增量</option>
            <option value="stars">按 Star 数</option>
            <option value="created">按创建时间（新→旧）</option>
          </select>
        </div>
      </div>
      <nav id="d-category-chips" class="chips" aria-label="按类别筛选"></nav>
      <p id="d-result-count" class="result-count"></p>
      <div id="d-list" class="list"></div>
    </section>
  </div>
</main>

<footer class="site-footer wrap">
  <p>项目介绍与本周看点由大模型根据 GitHub 公开信息和 README 生成，可能有偏差，请以项目主页为准。</p>
  <p>数据来自 <a href="https://github.com/fhan235/github1K" target="_blank" rel="noopener noreferrer">github1K</a> 流水线 · <span id="generated-at"></span></p>
</footer>

<script src="app.js" defer></script>
</body>
</html>
