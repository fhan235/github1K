name: "🚀 Daily 1K Milestone Tracker"

on:
  schedule:
    # UTC 22:00 = BJT 次日 06:00（GitHub Actions 实际执行可能延迟 5-30 分钟，
    # 起床时即可收到推送）
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      cold_start:
        description: "全量冷启动（30-60 分钟，仅首次使用）"
        type: boolean
        required: false
        default: false
      created_since:
        description: "仅扫描此日期之后创建的仓库（YYYY-MM-DD，留空使用 2020-01-01）"
        type: string
        required: false
        default: "2020-01-01"

permissions:
  contents: write  # 允许 git push 快照和报告回仓库

jobs:
  track-1k:
    runs-on: ubuntu-latest
    # 不限制运行时间（公开仓库免费），让爬虫稳稳跑完。
    # GitHub Actions 默认 job 超时为 6 小时，已远超实际所需。

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Run tracker
        env:
          G1K_GITHUB_TOKEN:      ${{ secrets.G1K_GITHUB_TOKEN }}
          G1K_GITHUB_TOKENS:     ${{ secrets.G1K_GITHUB_TOKENS }}
          G1K_WECOM_WEBHOOK_URL: ${{ secrets.G1K_WECOM_WEBHOOK_URL }}
          G1K_CREATED_SINCE:     ${{ inputs.created_since || vars.G1K_CREATED_SINCE || '2020-01-01' }}
          G1K_REPORT_PUBLIC_BASE_URL: ${{ vars.G1K_REPORT_PUBLIC_BASE_URL }}
        run: |
          if [ "${{ inputs.cold_start }}" = "true" ]; then
            python -m src.main --cold-start --notify
          else
            python -m src.main --notify
          fi

      - name: Upload full report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "1k-report-${{ github.run_id }}"
          path: |
            reports/milestone-1k-*.md
            reports/summary-1k-*.md
            data/snapshot_*.json
            data/snapshot_*.json.gz
          retention-days: 30

      - name: Upload full report to Tencent COS
        if: success()
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          if [ -z "$TENCENT_SECRET_ID" ] || [ -z "$TENCENT_SECRET_KEY" ] || [ -z "$TENCENT_COS_BUCKET" ] || [ -z "$TENCENT_COS_REGION" ]; then
            echo "未配置腾讯云 COS Secrets，跳过对象存储上传"
            exit 0
          fi
          pip install coscmd
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" -b "$TENCENT_COS_BUCKET" -r "$TENCENT_COS_REGION"

          TODAY=$(TZ='Asia/Shanghai' date +%F)
          # 只上传今天新生成的文件：历史产物不可变，已由之前的运行上传过，
          # 全量重传会让本步骤随时间越来越慢，且跨境链路偶发挂死曾导致 job 失败。
          FILES=$( {
            find reports -maxdepth 1 -name "milestone-1k-${TODAY}*.md"
            find data -maxdepth 1 -name "snapshot_${TODAY}*.json.gz"
            find data/daily -maxdepth 1 -name "milestones_${TODAY}*.json.gz" 2>/dev/null
          } )
          if [ -z "$FILES" ]; then
            echo "没有找到今天的产物文件，跳过上传"
            exit 0
          fi

          FAILED=0
          for f in $FILES; do
            ok=0
            for attempt in 1 2 3; do
              # 单文件 3 分钟硬超时：宁可重试，不让一个挂死的连接拖垮整个 job
              if timeout 180 coscmd upload -r "$f" "$f"; then
                ok=1
                break
              fi
              echo "⚠️ 上传失败（第 ${attempt} 次）: $f"
              sleep 5
            done
            [ $ok -eq 0 ] && FAILED=1
          done
          [ $FAILED -eq 1 ] && { echo "❌ 存在上传失败的文件"; exit 1; }
          echo "✅ 今日产物已全部上传"

      - name: Commit summary & compressed snapshot back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/summary-1k-*.md data/snapshot_*.json.gz data/daily/*.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有新的变更需要提交"
          else
            git commit -m "data: 🚀 $(TZ='Asia/Shanghai' date +%Y-%m-%d) 1K 摘要 + 压缩快照 + 结构化日榜"
            # 推送时重试一次（避免他人并发 push 导致的 non-fast-forward）
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.G1K_WECOM_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "未配置 WECOM webhook，跳过告警"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ⚠️ github1K CI 运行失败\n\n- 时间: $(TZ='Asia/Shanghai' date +%Y-%m-%dT%H:%M:%S+08:00)\n- 运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
