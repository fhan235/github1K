name: "🚀 Daily 1K Milestone Tracker"

on:
  schedule:
    # UTC 01:00 = BJT 09:00（GitHub Actions 实际执行可能延迟 5-30 分钟）
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      cold_start:
        description: "全量冷启动（30-60 分钟，仅首次使用）"
        type: boolean
        required: false
        default: false
      created_since:
        description: "仅扫描此日期之后创建的仓库（YYYY-MM-DD，留空使用仓库变量 G1K_CREATED_SINCE）"
        type: string
        required: false
        default: ""

permissions:
  contents: write  # 允许 git push 快照和报告回仓库

jobs:
  track-1k:
    runs-on: ubuntu-latest
    # 日常模式 <10 分钟；冷启动最多 90 分钟
    timeout-minutes: ${{ inputs.cold_start && 90 || 25 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Run tracker
        env:
          G1K_GITHUB_TOKEN:      ${{ secrets.G1K_GITHUB_TOKEN }}
          G1K_WECOM_WEBHOOK_URL: ${{ secrets.G1K_WECOM_WEBHOOK_URL }}
          G1K_CREATED_SINCE:     ${{ inputs.created_since || vars.G1K_CREATED_SINCE }}
          G1K_REPORT_PUBLIC_BASE_URL: ${{ vars.G1K_REPORT_PUBLIC_BASE_URL }}
        run: |
          if [ "${{ inputs.cold_start }}" = "true" ]; then
            python -m src.main --cold-start --notify
          else
            python -m src.main --notify
          fi

      - name: Upload full report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "1k-report-${{ github.run_id }}"
          path: |
            reports/milestone-1k-*.md
            reports/summary-1k-*.md
            data/snapshot_*.json
            data/snapshot_*.json.gz
          retention-days: 30

      - name: Upload full report to Tencent COS
        if: success()
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          if [ -z "$TENCENT_SECRET_ID" ] || [ -z "$TENCENT_SECRET_KEY" ] || [ -z "$TENCENT_COS_BUCKET" ] || [ -z "$TENCENT_COS_REGION" ]; then
            echo "未配置腾讯云 COS Secrets，跳过对象存储上传"
            exit 0
          fi
          pip install coscmd
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" -b "$TENCENT_COS_BUCKET" -r "$TENCENT_COS_REGION"
          find reports -name 'milestone-1k-*.md' -print0 | xargs -0 -I{} coscmd upload -r "{}" "{}"
          find data -name 'snapshot_*.json.gz' -print0 | xargs -0 -I{} coscmd upload -r "{}" "{}"

      - name: Commit summary & compressed snapshot back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/summary-1k-*.md data/snapshot_*.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有新的变更需要提交"
          else
            git commit -m "data: 🚀 $(date -u +%Y-%m-%d) 1K 摘要 + 压缩快照"
            # 推送时重试一次（避免他人并发 push 导致的 non-fast-forward）
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.G1K_WECOM_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "未配置 WECOM webhook，跳过告警"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ⚠️ github1K CI 运行失败\n\n- 时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n- 运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
